<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My POS System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap');

    /* LOCK OVERLAY — блокира цялото приложение по време на запазване */
    body.locked .main,
    body.locked .statusbar {
        pointer-events: none;
        opacity: 0.45;
        filter: grayscale(0.35);
        transition: opacity 0.2s, filter 0.2s;
    }

    #lockOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: rgba(13, 17, 23, 0.35);
    }

    body.locked #lockOverlay {
        display: flex;
    }

    .lock-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid var(--border);
        border-top-color: var(--blue-light);
        border-radius: 50%;
        animation: lockSpin 0.7s linear infinite;
    }

    @keyframes lockSpin {
        to {
            transform: rotate(360deg);
        }
    }

    .lock-text {
        font-family: 'Rajdhani', sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text);
    }

    #pinScreen {
        position: fixed;
        inset: 0;
        z-index: 20000;
        background: var(--bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
    }

    .pin-title {
        font-family: 'Rajdhani', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text);
        text-transform: uppercase;
    }

    .pin-input {
        width: 220px;
        padding: 14px;
        text-align: center;
        font-size: 22px;
        letter-spacing: 8px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
    }

        .pin-input:focus {
            outline: none;
            border-color: var(--blue-light);
        }

    .pin-error {
        color: var(--red);
        font-size: 13px;
        min-height: 16px;
    }

  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-card: #1c2333;
    --bg-card-hover: #212940;
    --border: #30363d;
    --blue: #2563eb;
    --blue-light: #3b82f6;
    --blue-glow: rgba(37,99,235,0.3);
    --text: #e6edf3;
    --text-muted: #8b949e;
    --red: #dc2626;
    --red-bg: rgba(220,38,38,0.15);
    --green: #16a34a;
    --orange: #f59e0b;        /* ← цвят за combo карти */
    --orange-glow: rgba(245,158,11,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg-primary);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 440px 1fr 320px;
    flex: 1;
    overflow: hidden;
    padding: 16px;
    gap: 16px;
  }

  /* PANELS */
  .panel {
    background: var(--bg-secondary);
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header { padding: 18px 20px 14px; flex-shrink: 0; }
  .panel-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text);
    padding-bottom: 10px; border-bottom: 2px solid var(--blue);
    display: inline-block;
  }

  /* ── TAB BAR ── */
  .tab-bar {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .tab-btn:hover { border-color: var(--blue-light); color: var(--text); }
  .tab-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  /* ── PRODUCTS GRID ── */
  .products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 4px 16px 16px;
    overflow-y: auto;
  }
  .products-grid::-webkit-scrollbar { width: 4px; }
  .products-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Regular product card */
  .product-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .product-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--blue-glow), transparent);
    opacity: 0; transition: opacity 0.2s;
  }
  .product-card:hover { border-color: var(--blue-light); transform: translateY(-2px); box-shadow: 0 4px 20px var(--blue-glow); }
  .product-card:hover::before { opacity: 1; }
  .product-card:active { transform: scale(0.96); }
  .product-emoji { font-size: 40px; line-height: 1; }
  .product-name  { font-size: 13px; font-weight: 500; color: var(--text); text-align: center; }
  .product-price { font-size: 12px; color: var(--text-muted); }

  /* ── COMBO CARD — full-width, gold accent ── */
  .combo-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 16px 16px;
    overflow-y: auto;
  }
  .combo-grid::-webkit-scrollbar { width: 4px; }
  .combo-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .combo-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .combo-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--orange-glow), transparent);
    opacity: 0; transition: opacity 0.2s;
  }
  .combo-card:hover { border-color: var(--orange); transform: translateY(-2px); box-shadow: 0 4px 20px var(--orange-glow); }
  .combo-card:hover::before { opacity: 1; }
  .combo-card:active { transform: scale(0.98); }

  .combo-badge {
    background: rgba(245,158,11,0.15);
    border: 1px solid var(--orange);
    border-radius: 8px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .combo-info { flex: 1; min-width: 0; }
  .combo-name  { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .combo-items { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combo-price-badge {
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.4);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px; font-weight: 700;
    color: var(--orange);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .combo-save {
    font-size: 10px; color: var(--green);
    font-weight: 600; text-align: right;
    margin-top: 2px;
  }

  /* CURRENT ORDER */
  .order-panel { display: flex; flex-direction: column; }
  .order-table-header {
    display: grid;
    grid-template-columns: 1fr 120px 90px 90px 36px;
    padding: 10px 20px;
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .order-items { flex: 1; overflow-y: auto; padding: 8px 0; }
  .order-items::-webkit-scrollbar { width: 4px; }
  .order-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .order-item {
    display: grid;
    grid-template-columns: 1fr 120px 90px 90px 36px;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    animation: slideIn 0.2s ease;
  }
  /* combo orders get a subtle gold left border */
  .order-item.is-combo { border-left: 2px solid var(--orange); }

  @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }

  .order-item-info { display: flex; align-items: center; gap: 10px; }
  .order-item-info .emoji { font-size: 22px; }
  .order-item-info .name  { font-size: 14px; font-weight: 500; }

  .qty-control { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; line-height: 1;
  }
  .qty-btn:hover { border-color: var(--blue-light); background: var(--blue-glow); color: var(--blue-light); }
  .qty-value { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
  .item-price { font-size: 13px; color: var(--text-muted); }
  .item-total { font-size: 14px; font-weight: 600; color: var(--blue-light); }
  .delete-btn {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid transparent; background: transparent;
    color: var(--red); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.15s;
  }
  .delete-btn:hover { background: var(--red-bg); border-color: var(--red); }

  /* TOTAL & BUTTONS */
  .order-footer { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .total-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .total-label  { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .total-amount { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: var(--blue-light); }
  .order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    padding: 14px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center;
    gap: 8px; transition: all 0.2s;
  }
  .btn-clear   { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  .btn-clear:hover { background: rgba(220,38,38,0.25); }
  .btn-confirm { background: var(--blue); color: white; }
  .btn-confirm:hover { background: var(--blue-light); box-shadow: 0 4px 20px var(--blue-glow); }
  .btn:active  { transform: scale(0.97); }

  /* ORDER HISTORY */
  .history-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .history-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid rgba(48,54,61,0.5);
    cursor: pointer; transition: background 0.15s; animation: slideIn 0.2s ease;
  }
  .history-item:hover { background: rgba(37,99,235,0.05); }
  .history-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--blue-light); flex-shrink: 0;
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name   { font-size: 13px; font-weight: 600; }
  .history-time   { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .history-amount { font-size: 13px; font-weight: 700; color: var(--blue-light); white-space: nowrap; }
  .history-footer { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .btn-open-sheet {
    width: 100%; padding: 12px; background: transparent;
    border: 1px solid var(--green); color: var(--green);
    border-radius: 8px; cursor: pointer;
    font-family: 'Exo 2', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
    gap: 8px; transition: all 0.2s;
  }
  .btn-open-sheet:hover { background: rgba(22,163,74,0.15); box-shadow: 0 0 12px rgba(22,163,74,0.2); }

  /* STATUS BAR */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 20px; background: var(--bg-secondary);
    border-top: 1px solid var(--border); font-size: 12px;
    color: var(--text-muted); flex-shrink: 0;
  }
  .statusbar-left  { display: flex; align-items: center; gap: 16px; }
  .statusbar-right { display: flex; align-items: center; gap: 16px; }
  .status-divider  { width: 1px; height: 14px; background: var(--border); }
  .empty-order {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 8px;
  }
  .empty-order .icon { font-size: 32px; opacity: 0.3; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
    padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  .toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-pending { background: #1c2333; border: 1px solid #3b82f6; color: #3b82f6; }
  .toast-success { background: #0d2818; border: 1px solid #16a34a; color: #4ade80; }
  .toast-error   { background: #2d0a0a; border: 1px solid #dc2626; color: #f87171; }
</style>
</head>
<body>

    <div id="pinScreen">
        <div class="pin-title">🔒 POS ЗАКЛЮЧЕН</div>
        <input type="password" id="pinInput" class="pin-input" maxlength="6" placeholder="••••" autofocus />
        <div class="pin-error" id="pinError"></div>
    </div>
    
    <div id="lockOverlay">
        <div class="lock-spinner"></div>
        <div class="lock-text">Обработва поръчката...</div>
    </div>

    <div class="main">

        <!-- ═══ LEFT: PRODUCTS ═══ -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Products</div>
            </div>

            <!-- TAB BAR -->
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('products', this)">🍔 Продукти</button>
                <button class="tab-btn" onclick="switchTab('combos',   this)">⭐ Комбо</button>
            </div>

            <!-- Products grid (shown by default) -->
            <div class="products-grid" id="productsGrid"></div>

            <!-- Combo grid (hidden by default) -->
            <div class="combo-grid" id="comboGrid" style="display:none"></div>
        </div>

        <!-- ═══ MIDDLE: CURRENT ORDER ═══ -->
        <div class="panel order-panel">
            <div class="panel-header">
                <div class="panel-title">Current Order</div>
            </div>
            <div class="order-table-header">
                <span>Item</span><span>Qty</span><span>Price</span><span>Total</span><span></span>
            </div>
            <div class="order-items" id="orderItems">
                <div class="empty-order">
                    <div class="icon">🛒</div>
                    <span>Кликни върху продукт, за да го добавиш</span>
                </div>
            </div>
            <div class="order-footer">
                <div class="total-row">
                    <span class="total-label">TOTAL:</span>
                    <span class="total-amount" id="totalAmount">0.00 $</span>
                </div>
                <div class="order-actions">
                    <button class="btn btn-clear" onclick="clearOrder()">🗑 CLEAR ORDER</button>
                    <button class="btn btn-confirm" onclick="confirmOrder()">✓ CONFIRM ORDER</button>
                </div>
            </div>
        </div>

        <!-- ═══ RIGHT: ORDER HISTORY ═══ -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Order History</div>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="history-footer" style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-open-sheet" onclick="openSheet()">📊 ВИЖДАЙ ТАБЛИЦАТА</button>
                <button class="btn-open-sheet" onclick="showShiftSummary()">🧾 ПРИКЛЮЧИ СМЯНА</button>
            </div>
        </div>

    </div>

    <!-- STATUS BAR -->
    <div class="statusbar">
        <div class="statusbar-left">
            <span>🧾</span>
            <span id="itemCount">0 items</span>
            <div class="status-divider"></div>
            <span id="statusTotal">0.00 $</span>
        </div>
        <div class="statusbar-right">
            <span>🕐 <span id="clock"></span></span>
            <div class="status-divider"></div>
            <span style="cursor:pointer;" onclick="changeCashierName()">👤 <span id="cashierNameLabel">Гост</span></span>
        </div>
    </div>

    <script>
        // ── Менюто вече се зарежда динамично от Google Sheets ("Меню" таб) ──────
        let PRODUCTS = [];
        let COMBOS = [];

function loadMenuFromSheets() {
    return fetch(SHEETS_URL + '?action=getMenu')
        .then(function (response) {

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            return response.json();
        })
        .then(function (data) {

            console.log('Google Sheets menu:', data);

            if (!data || !Array.isArray(data.products) || !Array.isArray(data.combos)) {
                throw new Error('Невалиден отговор от Google Sheets');
            }

            PRODUCTS = data.products;
            COMBOS = data.combos;

            console.log(
                'Заредени продукти:',
                PRODUCTS.length,
                'комбота:',
                COMBOS.length
            );
        })
        .catch(function (err) {

            console.error(
                'Грешка при зареждане на менюто:',
                err
            );

            PRODUCTS = [];
            COMBOS = [];

            showToast(
                '❌ Неуспешно зареждане на менюто',
                'error'
            );

            throw err;
        });
}

        // ── Проста PIN защита ────────────────────────────────────────────────
        const POS_PIN = '1515'; // смени с твоя PIN

        function checkPin() {
            const input = document.getElementById('pinInput');
            const err = document.getElementById('pinError');
            if (input.value === POS_PIN) {
                sessionStorage.setItem('pos_unlocked', 'yes');
                document.getElementById('pinScreen').style.display = 'none';
            } else {
                err.textContent = 'Грешен PIN';
                input.value = '';
                input.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (sessionStorage.getItem('pos_unlocked') === 'yes') {
                document.getElementById('pinScreen').style.display = 'none';
            }
            document.getElementById('pinInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') checkPin();
            });
        });

        function showShiftSummary() {
            fetch(SHEETS_URL + '?action=getShiftSummary')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var lines = ['📊 Обобщение за днес\n'];
                    lines.push('Общо поръчки: ' + data.orderCount);
                    lines.push('Общ приход: ' + data.totalRevenue.toFixed(2) + ' $\n');
                    lines.push('По касиер:');
                    Object.keys(data.byUser).forEach(function (user) {
                        var u = data.byUser[user];
                        lines.push('  ' + user + ': ' + u.orders + ' поръчки, ' + u.revenue.toFixed(2) + ' $');
                    });
                    alert(lines.join('\n'));
                })
                .catch(function () {
                    showToast('❌ Неуспешно зареждане на обобщението', 'error');
                });
        }

        // ═══════════════════════════════════════════════════════════════════════════
        //  3. GOOGLE SHEETS ИНТЕГРАЦИЯ
        //     Стъпки:
        //       1. Отвори sheets.google.com → нов файл
        //       2. Extensions → Apps Script → постави скрипта от инструкциите
        //       3. Deploy → New deployment → Web app → Anyone → Deploy
        //       4. Копирай URL-а и го постави по-долу вместо 'ПОСТАВИ_URL_ТУК'
// ═══════════════════════════════════════════════════════════════════════════
        const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxuyPbeqaSl0djohf_SD9r1kcflM7sAd4SO-ov3sZ4Mw2sGAV4BRg2W4Cd4NDvrE1Yxdw/exec';
        // Постави URL-а на твоя Google Sheet (от адресната лента)
        // Пример: https://docs.google.com/spreadsheets/d/XXXXXXX/edit
        const SHEET_VIEW_URL = 'https://docs.google.com/spreadsheets/d/1gxz6nK0CswCLHCspDVcCi7p2FZK4RaQ58W54RAUwqdg/edit?gid=0#gid=0';

        // ─────────────────────────────────────────────────────────────────────────
        //  STATE
        // ─────────────────────────────────────────────────────────────────────────
        let order = [];
        let history = [];
        let orderCount = 0; // ще се зареди от Google Sheets при стартиране
        let isSubmitting = false;  // true докато поръчката се обработва — заключва UI-то

        // ── Прост username система — пази се в localStorage на всеки PC ─────────
        function getCashierName() {
            return localStorage.getItem('pos_cashier_name') || 'Неизвестен';
        }

        function setCashierName(name) {
            localStorage.setItem('pos_cashier_name', name);
            document.getElementById('cashierNameLabel').textContent = name;
        }

        function changeCashierName() {
            const current = getCashierName();
            const name = prompt('Въведи твоето име:', current === 'Неизвестен' ? '' : current);
            if (name && name.trim()) {
                setCashierName(name.trim());
            }
        }

        function initCashierName() {
            const saved = localStorage.getItem('pos_cashier_name');
            if (saved) {
                document.getElementById('cashierNameLabel').textContent = saved;
            } else {
                changeCashierName();
            }
        }

        // ── Резервирай следващия № на поръчка от сървъра — атомарно, без дублиране ──
        function reserveNextOrderId() {
            if (!SHEETS_URL || SHEETS_URL === 'https://docs.google.com/spreadsheets/d/1gxz6nK0CswCLHCspDVcCi7p2FZK4RaQ58W54RAUwqdg/edit?gid=0#gid=0') {
                return Promise.resolve(++orderCount); // fallback, ако няма Sheets интеграция
            }
            return fetch(SHEETS_URL + '?action=getNextOrderId')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.orderId === 'number') {
                        return data.orderId;
                    }
                    throw new Error('Невалиден отговор от сървъра');
                });
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  TAB SWITCHING
        // ─────────────────────────────────────────────────────────────────────────
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('productsGrid').style.display = tab === 'products' ? 'grid' : 'none';
            document.getElementById('comboGrid').style.display = tab === 'combos' ? 'flex' : 'none';
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  RENDER PRODUCTS
        // ─────────────────────────────────────────────────────────────────────────
        function renderProducts() {
            document.getElementById('productsGrid').innerHTML = PRODUCTS.map(p => `
        <div class="product-card" onclick="addProduct(${p.id})">
          <div class="product-emoji">${p.emoji}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">${p.price.toFixed(2)} $</div>
        </div>
      `).join('');
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  RENDER COMBOS
        // ─────────────────────────────────────────────────────────────────────────
        function renderCombos() {
            document.getElementById('comboGrid').innerHTML = COMBOS.map(c => {
                // Изчисли нормалната цена (сума на всички продукти)
                const normalPrice = c.items.reduce((sum, it) => {
                    const p = PRODUCTS.find(p => p.id === it.productId);
                    return sum + (p ? p.price * it.qty : 0);
                }, 0);
                const saving = normalPrice - c.price;

                // Текст с продуктите: "1× Burger, 1× Cola, 1× Fries"
                const itemsText = c.items.map(it => {
                    const p = PRODUCTS.find(p => p.id === it.productId);
                    return p ? `${it.qty}× ${p.name}` : '';
                }).join(', ');

                const savingHtml = saving > 0.009
                    ? `<div class="combo-save">Спестяваш ${saving.toFixed(2)} $</div>`
                    : '';

                return `
          <div class="combo-card" onclick="addCombo(${c.id})">
            <div class="combo-badge">${c.emoji}</div>
            <div class="combo-info">
              <div class="combo-name">${c.name}</div>
              <div class="combo-items">${itemsText}</div>
              ${savingHtml}
            </div>
            <div class="combo-price-badge">${c.price.toFixed(2)} $</div>
          </div>
        `;
            }).join('');
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  ADD SINGLE PRODUCT
        // ─────────────────────────────────────────────────────────────────────────
        function addProduct(id) {
            if (isSubmitting) return;
            const product = PRODUCTS.find(p => p.id === id);
            const existing = order.find(o => o.product.id === id && !o.isCombo);
            if (existing) {
                existing.qty++;
            } else {
                order.push({ product, qty: 1, isCombo: false });
            }
            renderOrder();
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  ADD COMBO — добавя combото като ЕДИН ред в поръчката
        // ─────────────────────────────────────────────────────────────────────────
        function addCombo(comboId) {
            if (isSubmitting) return;
            const combo = COMBOS.find(c => c.id === comboId);
            if (!combo) return;

            // Провери дали вече има такова combo в поръчката
            const existing = order.find(o => o.isCombo && o.comboId === comboId);
            if (existing) {
                existing.qty++;
            } else {
                order.push({
                    product: {
                        id: combo.id,
                        name: combo.name,
                        emoji: combo.emoji,
                        price: combo.price,
                    },
                    qty: 1,
                    isCombo: true,
                    comboId: comboId,
                });
            }
            renderOrder();
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  RENDER ORDER
        // ─────────────────────────────────────────────────────────────────────────
        function renderOrder() {
            const container = document.getElementById('orderItems');

            if (order.length === 0) {
                container.innerHTML = `
          <div class="empty-order">
            <div class="icon">🛒</div>
            <span>Кликни върху продукт, за да го добавиш</span>
          </div>`;
                updateTotals();
                return;
            }

            container.innerHTML = order.map((o, idx) => `
        <div class="order-item ${o.isCombo ? 'is-combo' : ''}">
          <div class="order-item-info">
            <span class="emoji">${o.product.emoji}</span>
            <span class="name">${o.product.name}</span>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <span class="qty-value">${o.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
          <div class="item-price">${o.product.price.toFixed(2)} $</div>
          <div class="item-total">${(o.product.price * o.qty).toFixed(2)} $</div>
          <button class="delete-btn" onclick="removeItem(${idx})">🗑</button>
        </div>
      `).join('');

            updateTotals();
        }

        function changeQty(idx, delta) {
            if (isSubmitting) return;
            order[idx].qty += delta;
            if (order[idx].qty <= 0) order.splice(idx, 1);
            renderOrder();
        }
        function removeItem(idx) {
            if (isSubmitting) return;
            order.splice(idx, 1);
            renderOrder();
        }
        function getTotal() { return order.reduce((s, o) => s + o.product.price * o.qty, 0); }

        function updateTotals() {
            const total = getTotal();
            document.getElementById('totalAmount').textContent = total.toFixed(2) + ' $';
            document.getElementById('statusTotal').textContent = total.toFixed(2) + ' $';
            const count = order.reduce((s, o) => s + o.qty, 0);
            document.getElementById('itemCount').textContent = count + ' items';
        }

        function clearOrder() {
            if (isSubmitting) return;
            order = [];
            renderOrder();
        }

        function confirmOrder() {
            if (!order.length || isSubmitting) return;

            isSubmitting = true;
            document.body.classList.add('locked');

            const total = getTotal();
            const now = new Date();
            const date = now.toLocaleDateString('bg-BG');
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            const snapshot = [...order];
            const user = getCashierName();

            reserveNextOrderId().then(function (newOrderId) {
                orderCount = newOrderId;

                history.unshift({ id: orderCount, time, amount: total });
                order = [];
                renderOrder();
                renderHistory();

                if (SHEETS_URL && SHEETS_URL !== 'ПОСТАВИ_URL_ТУК') {
                    showToast('⏳ Записвам в Google Sheets…', 'pending');

                    const rows = [];
                    snapshot.forEach(o => {
                        rows.push({
                            orderId: orderCount,
                            date,
                            time,
                            name: o.product.name,
                            type: o.isCombo ? 'КОМБО' : 'Продукт',
                            qty: o.qty,
                            price: o.product.price,
                            rowTotal: (o.product.price * o.qty).toFixed(2),
                            isLast: false,
                            total: '',
                            user: user,
                        });
                    });
                    rows[rows.length - 1].isLast = true;
                    rows[rows.length - 1].total = total.toFixed(2);

                    enqueueOrder(rows, function () {
                        isSubmitting = false;
                        document.body.classList.remove('locked');
                    });
                } else {
                    isSubmitting = false;
                    document.body.classList.remove('locked');
                }
            }).catch(function (err) {
                console.error('Грешка при резервиране на № на поръчка:', err);
                showToast('❌ Грешка — поръчката НЕ е записана, опитай пак', 'error');
                isSubmitting = false;
                document.body.classList.remove('locked');
            });
        }

        // ── Опашка — поръчките се изпращат една по една, без да се оплитат ──
        const sheetsQueue = [];   // масив от поръчки чакащи да се изпратят
        let queueRunning = false;

        function enqueueOrder(rows, onComplete) {
            sheetsQueue.push({ rows: rows, onComplete: onComplete });
            if (!queueRunning) processQueue();
        }

        function processQueue() {
            if (sheetsQueue.length === 0) {
                queueRunning = false;
                return;
            }
            queueRunning = true;
            const item = sheetsQueue.shift();
            sendRowsSequentially(item.rows, 0, function () {
                showToast('✅ Записано в Google Sheets!', 'success');
                if (item.onComplete) item.onComplete();
                processQueue();
            });
        }

        function sendRowsSequentially(rows, idx, onDone) {
            if (idx >= rows.length) {
                onDone();
                return;
            }
            const r = rows[idx];
            const url = SHEETS_URL
                + '?orderId=' + encodeURIComponent(r.orderId)
                + '&date=' + encodeURIComponent(r.date)
                + '&time=' + encodeURIComponent(r.time)
                + '&name=' + encodeURIComponent(r.name)
                + '&type=' + encodeURIComponent(r.type)
                + '&qty=' + encodeURIComponent(r.qty)
                + '&price=' + encodeURIComponent(r.price)
                + '&rowTotal=' + encodeURIComponent(r.rowTotal)
                + '&isLast=' + encodeURIComponent(r.isLast)
                + '&total=' + encodeURIComponent(r.total)
                + '&user=' + encodeURIComponent(r.user || '');

            const img = new Image();
            img.onload = img.onerror = function () {
                setTimeout(() => sendRowsSequentially(rows, idx + 1, onDone), 200);
            };
            img.src = url;
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  TOAST NOTIFICATIONS
        // ─────────────────────────────────────────────────────────────────────────
        function showToast(msg, type) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.className = 'toast toast-' + type + ' toast-show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('toast-show'), 3000);
        }

        // ─────────────────────────────────────────────────────────────────────────
        //  HISTORY
        // ─────────────────────────────────────────────────────────────────────────
        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!history.length) {
                list.innerHTML = `<div class="empty-order"><div class="icon">📋</div><span>Няма история</span></div>`;
                return;
            }
            list.innerHTML = history.map(h => `
        <div class="history-item">
          <div class="history-icon">📋</div>
          <div class="history-info">
            <div class="history-name">Order #${h.id}</div>
            <div class="history-time">${h.time}</div>
          </div>
          <div class="history-amount">${h.amount.toFixed(2)} $</div>
        </div>
      `).join('');
        }
        function openSheet() {
            if (SHEET_VIEW_URL && SHEET_VIEW_URL !== 'ПОСТАВИ_SHEET_URL_ТУК') {
                window.open(SHEET_VIEW_URL, '_blank');
            } else {
                showToast('⚠️ Постави SHEET_VIEW_URL в HTML файла', 'error');
            }
        }

        // Clock
        function updateClock() {
            const n = new Date();
            document.getElementById('clock').textContent =
                n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Init
        loadMenuFromSheets().then(function () {
            renderProducts();
            renderCombos();
            renderOrder();
            renderHistory();
            initCashierName();
        });
    </script>
</body>
</html>
